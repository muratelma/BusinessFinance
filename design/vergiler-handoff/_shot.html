<style>
body{margin:0;font-family:var(--font-core)}
a{color:var(--ink);text-decoration:underline}a:hover{color:var(--ink-muted)}
.frame{position:absolute;top:80px;width:412px}
.frame-label{position:absolute;top:-40px;left:0;white-space:nowrap;font:600 18px/1.3 var(--font-core);color:var(--ink)}

.snip{height:auto;min-height:0}.note{position:absolute;width:2380px;font:15px/1.5 var(--font-core);color:var(--ink);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}.note h2{font:700 26px/1.25 var(--font-core);margin:0 0 8px;grid-column:1/-1}.note div{background:var(--surface-card);border:1px solid var(--border);border-radius:20px;padding:16px 20px}.note b{display:block;font:600 16px/1.3 var(--font-core);margin-bottom:6px}.note p{margin:0;color:var(--ink-muted);text-wrap:pretty}

<script type="text/babel" src="screens/Screens.jsx"></script>
<script type="text/babel" src="screens-v2/Common.jsx"></script>

<script type="text/babel" src="screens-v5/Vergiler.jsx"></script>
<script type="text/babel">
const SHOTS = {
'v1a': () => <VergilerScreen variant="empty" />,
'v1b': () => <VergilerScreen variant="empty-paid" />,
'v2': () => <VergilerScreen />,
'v2s': () => <VergilerScreen scroll={600} />,
'v3a': () => <VergilerScreen overlay={<OdedimSheet />} />,
'v3b': () => <VergilerScreen overlay={<OdedimSheet kind="kdv" />} />,
'v4': () => <VergilerScreen variant="empty" overlay={<OdemeEkleSheet />} />,
'v5': () => <VergilerScreen overlay={<OdemeEkleSheet withPending />} />,
'v6': () => <TurSecimiScreen />,
'v7': () => <TanimFormScreen />,
'v7s': () => <TanimFormScreen scroll={600} />,
'v8': () => <VergilerScreen overlay={<BekleyenSheet />} />,
'v9': () => <VergilerScreen scroll={600} overlay={<OdenmisSheet />} />,
'v9a': () => <VergilerScreen scroll={600} overlay={<OdenmisSheet confirm />} />,
'v9b': () => <VergilerScreen scroll={600} overlay={<OdenmisSheet kind="bulk" />} />,
'v9c': () => <TanimDetayScreen overlay={<OdenmisSheet kind="closed" />} />,
'v10': () => <TanimDetayScreen />,
'v10s': () => <TanimDetayScreen scroll={600} />,
's2': () => <SnipYaklasan />,
's3': () => <SnipKategori />,
's5': () => <SnipPlan />
};
window.SHOT_LABELS = {"v1a":"V1 · İlk kullanım","v1b":"V1 · İlk kullanım, Gider formundan ödenmiş vergi var","v2":"V2 · Dolu (önerilen: ana eylem sabit altta)","v2s":"V2 · Dolu, aşağı kaydırılmış","v3a":"V3 · Ödedim · tanımdan dolu","v3b":"V3 · Ödedim · gecikmiş, kartla","v4":"V4 · Vergi ödemesi ekle · tanım yok","v5":"V5 · Vergi ödemesi ekle · bekleyenler var","v6":"V6 · Tür seçimi (ilk kurulum, çoklu)","v7":"V7 · Vergi tanımı formu","v7s":"V7 · Vergi tanımı, alt","v8":"V8 · Bekleyen kalem ayrıntısı","v9":"V9 · Ödenmiş kalem","v9a":"V9 · Geri alma onayı","v9b":"V9 · Toplu ödeme ayrıntısı","v9c":"V9 · Kapatılmış kalem","v10":"V10 · Vergi tanımı ayrıntısı","v10s":"V10 · alt: duraklat / sil","s2":"Özet · Yaklaşanlar kartı (gecikenler tek satır)","s3":"Kategori formu · Vergi anahtarı","s5":"Tekrarlayan plan · Seçilen aylarda"};
let root = ReactDOM.createRoot(document.getElementById('shot'));
window.show = (id) => { root.unmount(); root = ReactDOM.createRoot(document.getElementById('shot')); const snip = /^s/.test(id); document.getElementById('shot').style.height = snip ? 'auto' : '892px'; root.render(SHOTS[id]()); };
window.fit = (full) => { const s = document.getElementById('shot'); if (!full) return s.offsetHeight; const sc = s.querySelector('.screen'); const b = sc && sc.querySelector('.body'); if (!b) return s.offsetHeight; let h = 0; for (const c of sc.children) h += (c === b ? b.scrollHeight : c.offsetHeight); s.style.height = h + 'px'; b.scrollTop = 0; return h; };
window.part = (y) => { document.getElementById('shot').style.transform = `translateY(${-y}px)`; };
window.go = (id, full) => { document.body.style.background = '#ff00ff'; show(id); part(0); setTimeout(() => fit(full), 300); };
show('v2');
</script></body></html>
