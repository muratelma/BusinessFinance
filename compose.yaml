name: business-finance

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-CU7-ubuntu-24.04
    mem_limit: 3g
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: 2048
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set in the local .env file}
    ports:
      - "127.0.0.1:${MSSQL_HOST_PORT:-14334}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

volumes:
  sqlserver-data:
    name: business-finance-sqlserver-data
